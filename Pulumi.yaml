name: LyricsPipeline
description: S3/SQS vocal extraction workers on ECS Fargate Spot
runtime: go
config:
  # Shared values live here. Stack files contain only intentional overrides.
  aws:region: eu-central-1
  name: vocal-extractor
  image:
    type: string
    default: ""
  tags:
    value:
      Purpose: vocal-extractor
  vpc:
    value:
      availabilityZone: eu-central-1a
      cidr: 10.42.0.0/16
      publicSubnetCIDR: 10.42.1.0/24
      privateSubnetCIDR: 10.42.2.0/24
      internetCIDR: 0.0.0.0/0
  s3:
    value:
      inputPrefix: input
      outputPrefix: output
  ecs:
    value:
      cpuUnits: 2048
      memoryMiB: 8192
      stopTimeoutSeconds: 120
      logRetentionDays: 30
      healthCheck:
        command: [CMD-SHELL, python healthcheck.py]
        intervalSeconds: 60
        timeoutSeconds: 5
        retries: 3
        startPeriodSeconds: 120
  sqs:
    value:
      visibilitySeconds: 900
      maxReceiveCount: 5
      longPollWaitSeconds: 20
      deadLetterRetentionDays: 14
  autoscaling:
    value:
      minTasks: 0
      maxTasks: 2
      idleMinutes: 5
      backlogPerWorker: 5
      scaleOutCooldownSeconds: 300
      scaleInCooldownSeconds: 120
  pulumi:tags:
    value:
      pulumi:template: go
